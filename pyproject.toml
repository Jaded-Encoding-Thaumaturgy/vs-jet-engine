[build-system]
requires = ["hatchling>=1.27.0", "versioningit"]
build-backend = "hatchling.build"

[project]
name = "vsjetengine"
description = "An engine for vapoursynth previewers, renderers and script analyis tools."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "COPYING" }
authors = [{ name = "cid-chan", email = "cid+git@cid-chan.moe" }]
maintainers = [
    { name = "Vardë", email = "ichunjo.le.terrible@gmail.com" },
    { name = "Jaded Encoding Thaumaturgy", email = "jaded.encoding.thaumaturgy@gmail.com" },
]
classifiers = [
    "Topic :: Multimedia :: Graphics",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["vapoursynth>=74"]
dynamic = ["version"]

[project.urls]
"Source Code" = "https://github.com/Jaded-Encoding-Thaumaturgy/vs-jet-engine"
"Contact" = "https://discord.gg/XTpc6Fa9eB"

[project.optional-dependencies]
trio = ["trio"]
pytest = ["pytest>=9.1.0"]

[project.entry-points.pytest11]
vsengine = "vsengine.pytest"

[dependency-groups]
dev = [
    "pyrefly~=1.3.2",
    "pytest>=9.1.0",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.0, <0.17.0",
    "trio",
    "vsstubs>=3.0.0",
    "pytest-mock>=3.16.0",
    "pytest-trio>=0.8.0",
]

[tool.hatch.version]
source = "versioningit"
default-version = "0.0.0+unknown"
next-version = "minor"
write = { file = "vsengine/_version.py", template = "__version__ = \"{normalized_version}\"\n__version_tuple__ = {version_tuple}" }

[tool.hatch.version.format]
distance = "{next_version}.dev{distance}+{vcs}{rev}"
dirty = "{next_version}+dirty"
distance-dirty = "{next_version}.dev{distance}+{vcs}{rev}.dirty"

[tool.hatch.build]
artifacts = ["vsengine/_version.py"]

[tool.hatch.build.targets.wheel]
packages = ["vsengine"]
exclude = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["vsengine", "tests"]

[tool.pytest.ini_options]
testpaths = "tests"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
disable_warnings = ["couldnt-parse"]
source = ["vsengine"]
omit = ["vsengine/_version.py", "vsengine/__init__.py", "tests/*"]

[tool.pyrefly]
project-excludes = ["stubs"]
search-path = ["stubs", "tests"]
preset = "strict"
min-severity = "info"

[tool.pyrefly.errors]
redundant-cast = "error"
implicit-any-lambda = "ignore"
no-any-return = "error"
no-any-return-explicit = "ignore"

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "ASYNC",
    "C4",
    "LOG",
    "G",
    "PYI",
    "PT",
    "RSE",
    "RET",
    "SIM",
    "ICN",
    "ISC",
    "N",
    "NPY",
    "PERF",
    "E",
    "ERA",
    "EXE",
    "UP",
    "FURB",
    "RUF",
]
ignore = ["BLE001", "B010"]


[tool.ruff.lint.per-file-ignores]
"__init__.*" = ["F401", "F403"]
